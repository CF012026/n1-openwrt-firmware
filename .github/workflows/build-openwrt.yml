name: 编译 N1 OpenWrt 官方版（对照测速用）

# 目的：与 ImmortalWrt 25.12 全家桶版做同硬件对照，
# 定位"宽带跑不满"是固件本身还是插件导致。纯官方 OpenWrt + LuCI，不带任何插件。

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ---------- 1. 释放磁盘空间 ----------
    - name: 释放磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: 初始化构建编号
      run: echo "FILE_DATE=_$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

    # ---------- 2. 安装编译依赖 ----------
    - name: 安装编译依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp nano ninja-build \
          p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget \
          xmlto xxd zlib1g-dev zstd
        sudo -E timedatectl set-timezone "$TZ"

    # ---------- 3. 克隆官方 OpenWrt ----------
    - name: 克隆 OpenWrt
      run: |
        df -hT $PWD
        git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
        cd openwrt
        echo "===== 内核版本 ====="
        grep 'LINUX_VERSION-6.12' include/kernel-6.12 2>/dev/null | head -2

    # ---------- 4. 安装 feeds（官方源）----------
    - name: 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ---------- 5. 生成配置（armsr/armv8 + LuCI，最小化）----------
    - name: 生成配置
      run: |
        cd openwrt
        cat > .config <<'EOF'
        CONFIG_TARGET_armsr=y
        CONFIG_TARGET_armsr_armv8=y
        CONFIG_TARGET_ROOTFS_PARTSIZE=2048
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_kmod-tun=y
        EOF
        sed -i 's/^[[:space:]]*//' .config
        make defconfig
        echo "===== 关键配置确认 ====="
        grep -E '^CONFIG_TARGET_(armsr|armsr_armv8)|^CONFIG_PACKAGE_luci=|^CONFIG_TARGET_ROOTFS_PARTSIZE' .config

    # ---------- 6. 下载源码 ----------
    - name: 下载源码
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ---------- 7. 编译 ----------
    - name: 编译
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    # ---------- 8. 提取内核版本（ophub 匹配用）----------
    - name: 提取内核版本
      run: |
        cd openwrt
        KVER="6.12$(grep -m1 'LINUX_VERSION-6.12' include/kernel-6.12 | awk '{print $3}')"
        echo "OPENWRT_KVER=$KVER" >> $GITHUB_ENV
        echo "openwrt 内核版本: $KVER"

    # ---------- 9. ophub 重打包为 N1 直刷镜像 ----------
    - name: ophub 重打包 N1 镜像
      run: |
        cd /workdir/openwrt 2>/dev/null || cd openwrt
        IMG=$(ls bin/targets/armsr/armv8/*generic-squashfs-combined.img | head -1)
        [ -n "$IMG" ] || IMG=$(ls bin/targets/armsr/armv8/*generic-squashfs-combined.img.gz | head -1)
        echo "输入镜像: $IMG （内核 $OPENWRT_KVER）"
        git clone -q --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt /tmp/ophub
        cd /tmp/ophub
        if sudo ./remake -b s905d -k "$OPENWRT_KVER" "$IMG"; then
          N1IMG=$(find /tmp/ophub/output -type f -name '*s905d*.img.gz' | head -1)
          [ -n "$N1IMG" ] || N1IMG=$(find /tmp/ophub/output -type f -name '*.img.gz' | head -1)
          if [ -n "$N1IMG" ]; then
            cp "$N1IMG" "$OLDPWD/bin/targets/armsr/armv8/" 2>/dev/null || true
            echo "✓ N1 直刷镜像已生成: $(basename $N1IMG)"
          fi
        else
          echo "::warning::ophub remake 失败（可能暂无 $OPENWRT_KVER），仅交付 armsr 镜像"
        fi
        cd - >/dev/null
        ls -lh bin/targets/armsr/armv8/ || true

    # ---------- 10. 整理并上传 ----------
    - name: 上传固件
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: N1-s905d-openwrt-official${{ env.FILE_DATE }}
        path: openwrt/bin/targets/armsr/armv8/*
        retention-days: 30
